---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: AI PR Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to (re-)review
        required: true

concurrency:
  # Label events get their own group so a Labeler run can't cancel an in-progress review
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: AI PR Review
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft) || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ github.event.repository.name }}-runner
    timeout-minutes: 15
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr_number) }}
          token: ${{ steps.app-token.outputs.token }}

      - name: AI PR Review
        uses: misospace/pr-reviewer-action@829f395f7154b4d87c229500fd09b30a8ad2224d # v3.3.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
          force-review: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          # Models (in-cluster LiteLLM fronting Azure AI Foundry)
          ai-base-url: http://litellm.ai.svc.cluster.local:4000/v1
          ai-api-format: openai
          ai-api-key: ${{ secrets.LITELLM_API_KEY }}
          ai-model: gpt-6.1-sol
          ai-smart-model: gpt-5.6-sol
          ai-fallback-model: gpt-5.4
          review-routing-mode: auto
          # GPT-5.x/6.x reasoning models reject non-default temperature and max_tokens
          ai-temperature: ""
          ai-tokens-param: max_completion_tokens
          ai-response-format: json_object
          # Review behaviour (advisory only; never gates merges)
          ci-timeout-sec: "180"
          fail-on-request-changes: "false"
          publish-mode: review_comment
          publish-review-comment: "true"
          standards-file-candidates: CLAUDE.md
          system-prompt-file: .agents/instructions/pr-review.instructions.md
          system-prompt-mode: append
          # Upstream lookups for breaking changes
          allowed-source-hosts: github.com,api.github.com,raw.githubusercontent.com,artifacthub.io,docs.siderolabs.com,www.talos.dev,talos.dev,docs.cilium.io,rook.io,fluxcd.io,kubernetes.io
          tool-allowed-gh-api-repos: "*"
