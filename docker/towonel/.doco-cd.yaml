---
working_dir: ./docker/towonel
# Restrict webhook-triggered deploys to pushes on main — without this, a
# webhook for any branch (e.g. an open Renovate PR branch) deploys straight
# to the VPS before the PR is reviewed/merged. Polling already only follows
# main (POLL_CONFIG.reference in docker-compose.app.yaml); this closes the
# same gap for the webhook path.
webhook_filter: ^refs/heads/main$
auto_discovery:
  enabled: true
  depth: 1
  delete: true
external_secrets:
  # Adjust these op:// paths to match your own 1Password vault/item layout —
  # these are placeholders, not real items. Pushover lines are only needed
  # if you keep the alerting block in 04-gatus/config/config.yaml.
  GATUS_PUSHOVER_TOKEN: op://vps/pushover/gatus_token
  GATUS_PUSHOVER_KEY: op://vps/pushover/user_key
  GATUS_REMOTE_HEARTBEAT_TOKEN: op://vps/towonel/heartbeat_token
  CROWDSEC_ENROLL_KEY: op://vps/crowdsec/enroll_key
  CADDY_ACME_EMAIL: op://vps/towonel-tunnel/acme_email
  TOWONEL_INVITE_HASH_KEY: op://vps/towonel-tunnel/invite_hash_key
force_recreate: false
reconciliation:
  enabled: true
  interval: 3600
