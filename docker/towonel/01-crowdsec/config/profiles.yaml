---
name: default_ip_remediation
# debug: true
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Ip"
decisions:
  - type: ban
    duration: 4h
# Progressive ban: 4h on the first decision for a value, +4h for each prior
# one (4h, 8h, 12h, ...). Falls back to the decision `duration` if it errors.
duration_expr: Sprintf('%dh', (GetDecisionsCount(Alert.GetValue()) + 1) * 4)
notifications:
  - http_pushover
on_success: break
---
name: default_range_remediation
# debug: true
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Range"
decisions:
  - type: ban
    duration: 4h
duration_expr: Sprintf('%dh', (GetDecisionsCount(Alert.GetValue()) + 1) * 4)
notifications:
  - http_pushover
on_success: break
