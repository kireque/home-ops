---
type: http
name: http_pushover
log_level: info
group_wait: 10s
group_threshold: 5
max_retry: 3
timeout: 10s

# Renders the HTTP request body. `env` reads PUSHOVER_TOKEN/PUSHOVER_USER_KEY
# from the container environment (never written to disk), and `toJson`
# handles escaping so alert-derived text (scenario, source IP, ...) can't
# break the JSON body.
format: |-
  {{- $lines := list -}}
  {{- range . -}}
  {{- $ip := "?" -}}{{- $cn := "?" -}}{{- $as := "?" -}}
  {{- if .Source -}}
    {{- $ip = .Source.IP -}}
    {{- if .Source.Cn -}}{{- $cn = .Source.Cn -}}{{- end -}}
    {{- if .Source.AsName -}}{{- $as = .Source.AsName -}}{{- end -}}
  {{- end -}}
  {{- $action := "detected, no decision" -}}
  {{- if .Decisions -}}
    {{- with index .Decisions 0 -}}
      {{- $type := trimPrefix "" .Type -}}
      {{- $duration := trimPrefix "" .Duration -}}
      {{- $action = printf "%s (%s)" $type $duration -}}
    {{- end -}}
  {{- end -}}
  {{- $lines = append $lines (printf "%s from %s (%s, %s) -> %s" (trimPrefix "crowdsecurity/" .Scenario) $ip $cn $as $action) -}}
  {{- end -}}
  {{ dict "token" (env "PUSHOVER_TOKEN") "user" (env "PUSHOVER_USER_KEY") "title" "CrowdSec" "priority" 1 "message" (join "\n" $lines) | toJson }}

url: https://api.pushover.net/1/messages.json
method: POST
headers:
  Content-Type: application/json
