---
# Pushover alerting is optional — remove the `alerting`/`alerts` blocks below
# if you don't use Pushover, or leave PUSHOVER_TOKEN/PUSHOVER_USER_KEY unset
# and gatus will just skip sending alerts.
alerting:
  pushover:
    application-token: ${PUSHOVER_TOKEN}
    default-alert:
      description: health-check failed
      failure-threshold: 3
      minimum-reminder-interval: 1h
      send-on-resolved: true
      success-threshold: 2
    priority: 1
    resolved-priority: 0
    title: Gatus
    user-key: ${PUSHOVER_USER_KEY}

endpoints:
  - name: towonel hub
    group: home
    url: https://${REMOTE_STATUS_HOSTNAME}/v1/health
    interval: 1m
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: pushover

  # Canary for the whole app->external.econline.nl->hub.econline.nl DNS/tunnel
  # path. Runs on the VPS with the box's normal, unmodified DNS resolution, so
  # unlike any in-cluster/LAN check it can't be fooled by DNS pointing back at
  # an internal-only IP that happens to still be reachable from the LAN — the
  # VPS genuinely can't route there, so a misconfiguration like that fails
  # this check immediately instead of going unnoticed.
  - name: external dns/tunnel path
    group: home
    url: https://echo.econline.nl/
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].kubernetes.podName == pat(*)"
    alerts:
      - type: pushover

# Dead-man's-switch: kube-prometheus-stack's Alertmanager routes its
# always-firing Watchdog alert here every ~2m30s. If this endpoint doesn't
# hear from the cluster within the heartbeat interval, home is unreachable
# from outside and gatus alerts via Pushover — the towonel VPS stays up
# independently of the home connection, so it can actually notice.
external-endpoints:
  - name: heartbeat
    group: home
    token: ${REMOTE_HEARTBEAT_TOKEN}
    heartbeat:
      interval: 5m
    alerts:
      - type: pushover

storage:
  type: sqlite
  caching: true
  path: ${GATUS_CONFIG_PATH}/gatus.db

ui:
  title: Status | Gatus
  header: Status

web:
  port: ${GATUS_WEB_PORT}
