---
networks:
  apps:
    name: apps
    external: false
services:
  traefik:
    command:
      - --certificatesresolvers.cf.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      # 1.1.1.1 sees the record instantly; give Let's Encrypt's validators time to see it too
      - --certificatesresolvers.cf.acme.dnsChallenge.propagation.delayBeforeChecks=60s
      # UniFi intercepts outbound DNS, so the authoritative servers can't be queried directly; check propagation via the allowed public resolvers
      - --certificatesresolvers.cf.acme.dnsChallenge.propagation.disableANSChecks=true
      # The resolver keeps its name so Traefik keeps the wildcard certificate it already holds in acme.json
      - --certificatesresolvers.cf.acme.dnsChallenge.provider=ovh
      - --certificatesresolvers.cf.acme.dnsChallenge.resolvers=1.1.1.1:53,9.9.9.9:53
      - --certificatesresolvers.cf.acme.storage=/certs/acme.json
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certResolver=cf
      - --entrypoints.websecure.http.tls.domains[0].main=*.econline.nl
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
    container_name: traefik
    environment:
      - OVH_APPLICATION_KEY=${OVH_APPLICATION_KEY}
      - OVH_APPLICATION_SECRET=${OVH_APPLICATION_SECRET}
      - OVH_CONSUMER_KEY=${OVH_CONSUMER_KEY}
      - OVH_ENDPOINT=ovh-eu
    image: ghcr.io/traefik/traefik:v3.7.19@sha256:a6c0194dda77bcb804824580f36fa7edc56e315b1acfe933366c8b52844a78a4
    networks:
      - apps
    # TrueNAS UI owns 80/443 on 10.1.1.11; 10.1.1.18 is a second br0 alias for docker apps
    ports:
      - 10.1.1.18:80:80
      - 10.1.1.18:443:443
    restart: unless-stopped
    volumes:
      - acme:/certs
      - /var/run/docker.sock:/var/run/docker.sock:ro
volumes:
  acme:
