---
networks:
  apps:
    name: apps
    external: true
services:
  garage:
    command:
      - /garage
      - '-c'
      - /etc/garage/garage.toml
      - server
    container_name: garage
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
    image: docker.io/dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    labels:
      dexd.enabled: 'true'
      traefik.enable: 'true'
      traefik.http.routers.garage-s3.rule: Host(`s3.econline.nl`)
      traefik.http.services.garage-s3.loadbalancer.server.port: '9000'
    networks:
      - apps
    restart: unless-stopped
    user: '568:568'
    volumes:
      - ./config/garage.toml:/etc/garage/garage.toml:ro
      - meta:/var/lib/garage/meta
      - data:/var/lib/garage/data
  garage-ui:
    container_name: garage-ui
    # No auth configured, so the UI asks for the Garage admin token at login.
    environment:
      GARAGE_UI_GARAGE_ADMIN_ENDPOINT: http://garage:9002
      GARAGE_UI_GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_UI_GARAGE_ENDPOINT: http://garage:9000
      GARAGE_UI_GARAGE_REGION: us-east-1
      GARAGE_UI_SERVER_DOMAIN: garage.econline.nl
      GARAGE_UI_SERVER_ENVIRONMENT: production
      GARAGE_UI_SERVER_HOST: 0.0.0.0
      GARAGE_UI_SERVER_PORT: 8080
      GARAGE_UI_SERVER_ROOT_URL: https://garage.econline.nl
    image: docker.io/noooste/garage-ui:v0.14.0@sha256:e4a33c448304a3f6e60f08d6aa71b2471fd79ac870a5c7e178ea247dea3238b3
    labels:
      dexd.enabled: 'true'
      traefik.enable: 'true'
      traefik.http.routers.garage-ui.rule: Host(`garage.econline.nl`)
      traefik.http.services.garage-ui.loadbalancer.server.port: '8080'
    networks:
      - apps
    restart: unless-stopped
    volumes:
      - garage-ui-data:/app/data
volumes:
  data:
    driver: local
    driver_opts:
      device: /mnt/tank/apps/garage/data
      o: bind
      type: none
  meta:
    driver: local
    driver_opts:
      device: /mnt/tank/apps/garage/meta
      o: bind
      type: none
  garage-ui-data:
