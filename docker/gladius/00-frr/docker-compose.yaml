---
# Announces the docker apps IP (10.1.6.21/32) to the UniFi gateway over BGP.
# The IP itself is a TrueNAS interface alias; the gateway needs a matching
# neighbor (see kubernetes/apps/kube-system/cilium/README.md).
name: frr
services:
  frr:
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
      - SYS_ADMIN
    container_name: frr
    image: quay.io/frrouting/frr:10.7.1@sha256:e995beaa50fdc9edb35eadcfefa29b7f062cc06f2b812613789b68fa541554d2
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config/daemons:/etc/frr/daemons:ro
      - ./config/frr.conf:/etc/frr/frr.conf:ro
