---
working_dir: ./docker/gladius
auto_discovery:
  enabled: true
  depth: 1
  delete: true
external_secrets:
  DEXD_UNIFI_API_KEY: op://Docker/UniFi - dexd/password
  GARAGE_ADMIN_TOKEN: op://Docker/Garage/admin_key
  GARAGE_RPC_SECRET: op://Docker/Garage/rpc_secret
  OVH_APPLICATION_KEY: op://Docker/OVH - Traefik/application_key
  OVH_APPLICATION_SECRET: op://Docker/OVH - Traefik/application_secret
  OVH_CONSUMER_KEY: op://Docker/OVH - Traefik/consumer_key
force_recreate: false
reconciliation:
  enabled: true
  interval: 3600
