[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
JUST_UNSTABLE = "1"
LEFTHOOK_OUTPUT = "false"

_.file = [
  "{{config_root}}/.secrets.env",
]

[tools]
"python" = "3.14.7"
"ansible" = "latest"
"ansible-core" = "latest"
"pipx:flux-local" = "8.4.0"
"pipx:makejinja" = "2.9.1"
"talhelper" = "3.1.17"
"just" = "1.58.0"
"cilium-cli" = "0.20.0"
"gum" = "2.0.1"
"gh" = "2.101.0"
"cloudflared" = "2026.9.1"
"cue" = "0.17.1"
"age" = "1.3.2"
"flux2" = "2.9.5"
"sops" = "3.13.3"
"task" = "3.53.1"
"helm" = "4.3.0"
"helmfile" = "1.8.0"
"jq" = "1.8.1"
"kustomize" = "5.7.1"
"kubectl" = "1.37.0"
"yq" = "4.53.6"
"aqua:mitsuhiko/minijinja" = "2.24.0"
"talosctl" = "1.14.0"
"kubeconform" = "0.8.0"
"k9s" = "0.51.0"
"yamlfmt" = "0.21.0"
"lefthook" = "2.1.14"
"actionlint" = "1.7.12"
"yamllint" = "1.38.0"
"github:home-operations/flate" = "v0.6.5"
"github:nklmilojevic/sofka" = "0.28.3"

[hooks]
postinstall = [
  "lefthook install",
  "ansible-galaxy install -r {{config_root}}/ansible/requirements.yaml",
]
