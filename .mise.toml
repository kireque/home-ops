[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
JUST_UNSTABLE = "1"
LEFTHOOK_OUTPUT = "false"

_.file = [
  "{{config_root}}/.secrets.env",
]

[tools]
"python" = "3.14.7"
"pipx:ansible" = "latest"
"pipx:ansible-core" = "latest"
"pipx:flux-local" = "8.4.0"
"pipx:makejinja" = "2.8.2"
"aqua:budimanjojo/talhelper" = "3.1.16"
"aqua:casey/just" = "1.58.0"
"aqua:cilium/cilium-cli" = "0.19.7"
"aqua:charmbracelet/gum" = "2.0.0"
"aqua:cli/cli" = "2.98.0"
"aqua:cloudflare/cloudflared" = "2026.8.2"
"aqua:cue-lang/cue" = "0.17.1"
"aqua:FiloSottile/age" = "1.3.1"
"aqua:fluxcd/flux2" = "2.9.4"
"aqua:getsops/sops" = "3.13.3"
"aqua:go-task/task" = "3.53.1"
"aqua:helm/helm" = "4.2.4"
"aqua:helmfile/helmfile" = "1.7.4"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubernetes-sigs/kustomize" = "5.7.1"
"aqua:kubernetes/kubernetes/kubectl" = "1.36.4"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:mitsuhiko/minijinja" = "2.24.0"
"aqua:siderolabs/talos" = "1.13.9"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:derailed/k9s" = "0.51.0"
"aqua:google/yamlfmt" = "0.21.0"
"aqua:evilmartians/lefthook" = "2.1.11"
"github:home-operations/flate" = "v0.5.1"

[hooks]
postinstall = [
  "lefthook install",
  "ansible-galaxy install -r {{config_root}}/ansible/requirements.yaml",
]
