[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
JUST_UNSTABLE = "1"
LEFTHOOK_OUTPUT = "false"

_.file = [
  "{{config_root}}/.secrets.env",
]

[tools]
"python" = "3.15.2"
"ansible" = "latest"
"ansible-core" = "latest"
"pipx:flux-local" = "8.4.0"
"pipx:makejinja" = "2.9.1"
"talhelper" = "3.1.17"
"just" = "1.59.0"
"cilium-cli" = "0.20.2"
"gum" = "2.0.2"
"gh" = "2.103.3"
"cloudflared" = "2026.10.5"
"cue" = "0.17.1"
"age" = "1.3.2"
"flux2" = "2.10.0"
"sops" = "3.13.3"
"task" = "3.54.0"
"helm" = "4.3.1"
"helmfile" = "1.8.2"
"jq" = "1.8.2"
"kustomize" = "5.8.3"
"kubectl" = "1.37.2"
"yq" = "4.54.1"
"aqua:mitsuhiko/minijinja" = "3.0.4"
"talosctl" = "1.14.5"
"kubeconform" = "0.8.0"
"k9s" = "0.51.0"
"yamlfmt" = "0.21.0"
"lefthook" = "2.2.2"
"actionlint" = "1.7.12"
"yamllint" = "1.38.0"
"zizmor" = "1.31.1"
"github:home-operations/flate" = "v0.6.5"
"github:nklmilojevic/sofka" = "0.32.0"

[hooks]
postinstall = [
  "lefthook install",
  "ansible-galaxy install -r {{config_root}}/ansible/requirements.yaml",
]
