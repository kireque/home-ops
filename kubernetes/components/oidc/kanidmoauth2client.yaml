---
# TODO: add schema
# Issuer: https://idm.econline.nl/oauth2/openid/${APP}-oidc
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: ${APP}-oidc
spec:
  disableConsentPrompt: true
  displayname: ${APP}
  # Shown on the Kanidm apps page; apps whose dashboard-icons name differs
  # from the app name set OIDC_ICON_URL in their ks.yaml
  image:
    url: ${OIDC_ICON_URL:=https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/${APP}.svg}
  kanidmRef:
    name: sso
    namespace: security
  origin: https://${OIDC_HOSTNAME}/
  preferShortUsername: true
  redirectUrl:
    - https://${OIDC_HOSTNAME}/oauth2/callback
  scopeMap:
    - group: homelab-admins@idm.econline.nl
      scopes:
        - openid
  # Envoy Gateway reads the secret from the client-secret key
  secretKeyAliases:
    clientSecret:
      - client-secret
  strictRedirectUrl: true
