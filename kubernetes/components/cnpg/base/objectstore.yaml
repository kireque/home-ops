---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: ${APP}-postgres
spec:
  configuration:
    # Garage on the NAS (docker/gladius/04-garage); off-cluster.
    destinationPath: s3://${CNPG_BUCKET:=cnpg}/
    endpointURL: ${CNPG_ENDPOINT:=https://s3.econline.nl}
    s3Credentials:
      accessKeyId:
        name: ${APP}-postgres-objectstore-secret
        key: AWS_ACCESS_KEY_ID
      region:
        name: ${APP}-postgres-objectstore-secret
        key: AWS_REGION
      secretAccessKey:
        name: ${APP}-postgres-objectstore-secret
        key: AWS_SECRET_ACCESS_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
      maxParallel: 2
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 256Mi
  retentionPolicy: ${CNPG_RETENTION:=30d}
