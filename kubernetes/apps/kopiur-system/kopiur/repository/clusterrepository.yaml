---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
  annotations:
    # Verified all existing SnapshotPolicy consumers already resolve to
    # hostname=namespace/username=policyName, so this is a no-op in
    # practice — not an actual identity/lineage change.
    kopiur.home-operations.com/allow-identity-change: "true"
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-nas-secret
          namespace: kopiur-system
      # Garage on the NAS (docker/gladius/04-garage); off-cluster
      bucket: kopiur
      endpoint: s3.econline.nl
      region: us-east-1
  # The bucket holds the repo copied over from NFS; never initialise an empty one
  create:
    enabled: false
  encryption:
    passwordSecretRef:
      name: kopiur-nas-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
  maintenance:
    schedule:
      quick:
        cron: 0 * * * *
        jitter: 10m
      full:
        cron: 0 3 * * *
        jitter: 1h
  moverDefaults:
    cache:
      capacity: 1Mi
      mode: Ephemeral
      storageClassName: openebs-hostpath
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    scratch:
      capacity: 1Mi
      storageClassName: openebs-hostpath
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    ttlSecondsAfterFinished: 300
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    timezone: Europe/Amsterdam
  server:
    auth:
      insecure:
        acknowledgeInsecure: true
    namespace: kopiur-system
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    readOnly: true
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
