---
# TODO: add schema
# kaniop writes the credentials to audiobookshelf-kanidm-oauth2-credentials.
# Issuer: https://idm.econline.nl/oauth2/openid/audiobookshelf
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: audiobookshelf
spec:
  disableConsentPrompt: true
  displayname: Audiobookshelf
  image:
    url: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/audiobookshelf.svg
  kanidmRef:
    name: sso
    namespace: security
  origin: https://audiobookshelf.econline.nl/
  # preferred_username is matched to the existing Audiobookshelf user (erik)
  preferShortUsername: true
  # the phone apps sign in through mobile-redirect, which hands off to audiobookshelf://oauth
  redirectUrl:
    - https://audiobookshelf.econline.nl/auth/openid/callback
    - https://audiobookshelf.econline.nl/auth/openid/mobile-redirect
  scopeMap:
    - group: homelab-admins@idm.econline.nl
      scopes:
        - email
        - openid
        - profile
  strictRedirectUrl: true
