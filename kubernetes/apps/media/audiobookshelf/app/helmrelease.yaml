---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiobookshelf
spec:
  chartRef:
    kind: OCIRepository
    name: audiobookshelf
  interval: 1h
  values:
    externalSecrets:
      audiobookshelf:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              ABS_ROOT_PASSWORD: "{{ .password }}"
              ABS_ROOT_USERNAME: "{{ .username }}"
        dataFrom:
          - extract:
              key: audiobookshelf
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      audiobookshelf:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/advplyr/audiobookshelf
              tag: 2.37.2@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
            env:
              AUDIOBOOKSHELF_GID: 1000
              AUDIOBOOKSHELF_UID: 1000
              CONFIG_PATH: /config
              METADATA_PATH: /config/metadata
              PORT: &port 80
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1536Mi
      # root user (from 1Password), Audiobooks library, Kanidm sign-in; idempotent, reruns on every upgrade
      setup:
        type: job
        annotations:
          helm.sh/hook: post-install,post-upgrade
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
        job:
          backoffLimit: 3
        containers:
          app:
            image: *image
            command:
              - node
              - /scripts/setup.mjs
            env:
              ABS_LIBRARY_PATH: /media/audiobooks
              ABS_URL: http://audiobookshelf.media.svc.cluster.local
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: audiobookshelf-kanidm-oauth2-credentials
                    key: CLIENT_ID
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: audiobookshelf-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
              OIDC_ISSUER: https://idm.econline.nl/oauth2/openid/audiobookshelf
            envFrom:
              - externalSecretRef:
                  identifier: audiobookshelf
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        pod:
          restartPolicy: Never
    service:
      app:
        controller: audiobookshelf
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames:
          - "{{ .Release.Name }}.econline.nl"
        # public via towonel so the mobile apps sync away from home; the app's own login (local + Kanidm) protects it
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          audiobookshelf:
            app:
              - path: /config
      media:
        type: nfs
        server: gladius.home.econline.nl
        path: /mnt/tank/media
        advancedMounts:
          audiobookshelf:
            app:
              - path: /media
      scripts:
        type: configMap
        name: audiobookshelf-configmap
        advancedMounts:
          setup:
            app:
              - path: /scripts
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          audiobookshelf:
            app:
              - path: /.npm
                subPath: npm
              - path: /metadata/logs
                subPath: logs
              - path: /tmp
                subPath: tmp
