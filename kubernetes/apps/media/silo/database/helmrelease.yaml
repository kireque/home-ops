---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silo-database
spec:
  chartRef:
    kind: OCIRepository
    name: silo-database
  interval: 1h
  values:
    externalSecrets:
      silo-database:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              POSTGRES_DB: silo
              POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
              POSTGRES_USER: "{{ .POSTGRES_USER }}"
        dataFrom:
          - extract:
              key: silo
    controllers:
      postgres:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: pgvector/pgvector
              tag: pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
            env:
              POSTGRES_INITDB_ARGS: --data-checksums
            envFrom:
              - externalSecretRef:
                  identifier: silo-database
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
      valkey:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: valkey/valkey
              tag: 9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
            args:
              - --save
              - ""
              - --appendonly
              - "no"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
    service:
      postgres:
        controller: postgres
        ports:
          db:
            port: 5432
      valkey:
        controller: valkey
        ports:
          cache:
            port: 6379
    persistence:
      # pg18+ images keep PGDATA in a versioned subdir (/var/lib/postgresql/18/docker)
      data:
        existingClaim: silo-database
        advancedMounts:
          postgres:
            app:
              - path: /var/lib/postgresql
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          postgres:
            app:
              - path: /dev/shm
      valkey-data:
        type: emptyDir
        advancedMounts:
          valkey:
            app:
              - path: /data
