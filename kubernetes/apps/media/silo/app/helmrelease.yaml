---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silo
spec:
  chartRef:
    kind: OCIRepository
    name: silo
  interval: 1h
  timeout: 15m
  values:
    externalSecrets:
      silo:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              DATABASE_URL: "postgres://{{ .POSTGRES_USER }}:{{ urlquery .POSTGRES_PASSWORD }}@silo-database-postgres.media.svc.cluster.local.:5432/silo?sslmode=disable"
              REDIS_URL: redis://silo-database-valkey.media.svc.cluster.local.:6379/0
              SECRET_KEY: "{{ .SECRET_KEY }}"
        dataFrom:
          - extract:
              key: silo
      # admin API key, mounted only by the transcode register-node init container
      node-registration:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              SILO_ADMIN_API_KEY: "{{ .SILO_ADMIN_API_KEY }}"
        dataFrom:
          - extract:
              key: silo
    defaultPodOptions:
      labels:
        gpu-consumer: "true"
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: silo-gpu
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      silo:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Silo fails readiness, then drains in-flight requests on stop
          terminationGracePeriodSeconds: 120
        containers:
          app:
            image: &image
              repository: ghcr.io/silo-server/silo-server
              tag: build-1871@sha256:61f056d86da4559e349bf118ba409be7fcdb485e01751dd039b9a625d7ac3d1a
            env: &env
              HOME: /tmp
              JF_PORT: &jfPort 8096
              PORT: &port 8080
              SILO_METRICS_LISTEN: :9091
              SILO_PLUGIN_CACHE_DIR: /tmp/silo-plugins
              SILO_TRUSTED_PROXIES: 10.244.0.0/16
              # legacy Intel OpenCL runtime (copied in by the intel-opencl-legacy init container)
              LD_LIBRARY_PATH: /opt/intel-legacy/lib
              OCL_ICD_VENDORS: /opt/intel-legacy/vendors
            envFrom: &envFrom
              - externalSecretRef:
                  identifier: silo
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  failureThreshold: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/ready
                    port: *port
                  failureThreshold: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  failureThreshold: 60
                  periodSeconds: 10
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
              readOnlyRootFilesystem: true
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 6Gi
        initContainers:
          # Silo's image only ships Intel NEO 26.x, which dropped Gen9-Gen11 iGPUs (UHD 620 here),
          # so OpenCL tone mapping is unavailable and HDR transcodes fall back to software.
          # Borrow the frozen legacy1 runtime (NEO 24.35 + IGC 1.0.17537) from the Jellyfin image.
          intel-opencl-legacy: &oclLegacy
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                d=/opt/intel-legacy
                mkdir -p $d/lib $d/vendors
                cp -L /usr/lib/x86_64-linux-gnu/intel-opencl/libigdrcl_legacy1.so \
                  /usr/local/lib/libigc.so.1 /usr/local/lib/libigdfcl.so.1 \
                  /usr/local/lib/libiga64.so.1 /usr/local/lib/libopencl-clang.so.14 $d/lib/
                echo $d/lib/libigdrcl_legacy1.so > $d/vendors/intel_legacy1.icd
                echo /usr/lib/x86_64-linux-gnu/intel-opencl/libigdrcl.so > $d/vendors/intel.icd
            securityContext: *securityContext
      transcode:
        type: statefulset
        replicas: 3
        annotations:
          reloader.stakater.com/auto: "true"
        statefulset:
          podManagementPolicy: Parallel
          serviceName:
            identifier: transcode
        pod:
          # one transcode worker per node, so each iGPU gets its own
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/controller: transcode
                      app.kubernetes.io/instance: silo
          # SILO_NODE_DRAIN_TIMEOUT defaults to 10m; cover it plus shutdown
          terminationGracePeriodSeconds: 700
        initContainers:
          intel-opencl-legacy: *oclLegacy
          wait-for-api:
            image:
              repository: busybox
              tag: 1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            command:
              - /bin/sh
              - -c
              - until wget -q -O /dev/null http://silo-app.media.svc.cluster.local:8080/api/v1/ready; do sleep 3; done
            securityContext: *securityContext
          # Silo has no node self-registration; add this pod to stream_nodes via the admin API if missing
          register-node:
            dependsOn: wait-for-api
            image:
              repository: busybox
              tag: 1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            env:
              <<: &nodeIdentity
                POD_NAME:
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                NODE_NAME:
                  value: $(POD_NAME)
                  dependsOn: POD_NAME
                NODE_URL:
                  value: http://$(POD_NAME).silo-transcode.media.svc.cluster.local:8080
                  dependsOn: POD_NAME
              SILO_ADMIN_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: silo-node-registration
                    key: SILO_ADMIN_API_KEY
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                api=http://silo-app.media.svc.cluster.local:8080/api/v2/admin/nodes
                auth="Authorization: Bearer $SILO_ADMIN_API_KEY"
                if wget -qO- --header "$auth" "$api" | grep -qF "\"url\":\"$NODE_URL\""; then
                  echo "$NODE_NAME already registered"
                  exit 0
                fi
                wget -qO- --header "$auth" --header "Content-Type: application/json" \
                  --post-data "{\"name\":\"$NODE_NAME\",\"type\":\"transcode\",\"url\":\"$NODE_URL\"}" "$api"
                echo
                echo "$NODE_NAME registered as $NODE_URL"
            securityContext: *securityContext
        containers:
          app:
            image: *image
            env:
              <<:
                - *env
                - *nodeIdentity
              MODE: transcode
            envFrom: *envFrom
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  failureThreshold: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
              # headless-service DNS for NODE_URL only resolves while Ready
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  failureThreshold: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
            securityContext: *securityContext
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4Gi
    service:
      app:
        controller: silo
        ports:
          http:
            port: *port
          jellyfin:
            port: *jfPort
          metrics:
            port: 9091
      transcode:
        controller: transcode
        clusterIP: None
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        serviceName: silo-app
        endpoints:
          - port: metrics
            relabelings:
              - sourceLabels:
                  - __meta_kubernetes_pod_name
                targetLabel: instance
              - targetLabel: job
                replacement: silo
              - targetLabel: process_role
                replacement: api
      transcode:
        serviceName: silo-transcode
        endpoints:
          - port: http
            relabelings:
              - sourceLabels:
                  - __meta_kubernetes_pod_name
                targetLabel: instance
              - targetLabel: job
                replacement: silo
              - targetLabel: process_role
                replacement: transcode
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.econline.nl"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            timeouts:
              backendRequest: 3600s
      jellyfin:
        hostnames:
          - "{{ .Release.Name }}-jf.econline.nl"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *jfPort
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: gateway.envoyproxy.io
                  kind: HTTPRouteFilter
                  name: silo-jellyfin-items-path
            timeouts:
              backendRequest: 3600s
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          silo:
            app:
              - path: /var/lib/silo
      intel-legacy:
        type: emptyDir
        globalMounts:
          - path: /opt/intel-legacy
      media:
        type: nfs
        server: gladius.home.econline.nl
        path: /mnt/tank/media
        globalMounts:
          - path: /media
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
