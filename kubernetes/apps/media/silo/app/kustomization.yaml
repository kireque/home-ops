---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./httproutefilter.yaml
  - ./ocirepository.yaml
# First creation only: import the database from the old standalone Postgres
# (silo-database HelmRelease) instead of the cnpg/pg18 component's recovery
# bootstrap, which has no backup to restore yet. Lives here, not in ks.yaml,
# because cluster-apps replaces every child's spec.patches. Drop it once the
# first base backup exists (recovery keeps the locale).
# The locale must match the source (en_US.utf8): media_item_aliases.normalized_title
# is generated by normalize_search_text(), whose LOWER() and [[:alnum:]] follow
# LC_CTYPE. Under CNPG's default C locale every non-Latin title normalizes to ''
# and the unique index on it fails to build.
patches:
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
    patch: |-
      - op: replace
        path: /spec/bootstrap
        value:
          initdb:
            database: silo
            localeCType: en_US.utf8
            localeCollate: en_US.utf8
            owner: silo
            import:
              type: microservice
              databases:
                - silo
              source:
                externalCluster: silo-database
      - op: add
        path: /spec/externalClusters/-
        value:
          name: silo-database
          connectionParameters:
            dbname: silo
            host: silo-database-postgres.media.svc.cluster.local
            sslmode: disable
            user: silo
          password:
            name: silo-database
            key: POSTGRES_PASSWORD
