---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  # The agent has a shell: only the internal gateway may reach the WebUI.
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "8787"
              protocol: TCP
    # With DSR and host-only socket LB, a same-node ClusterIP backend's replies
    # arrive already reverse-NATed to the service IP, miss conntrack and hit
    # ingress policy. Admit the egress targets below so their replies get in.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/managed-by: litellm-operator
            app.kubernetes.io/name: litellm
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: searxng
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
  # Egress is allowlisted: LiteLLM (models + MCP), SearXNG, and the package
  # and source hosts mise/uv need. Everything else is dropped.
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/managed-by: litellm-operator
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: searxng
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # No cluster-wide DNS allow exists; the dns rule also feeds toFQDNs below.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: files.pythonhosted.org
        - matchName: github.com
        - matchName: hermes-agent.nousresearch.com
        - matchName: mise-versions.jdx.dev
        - matchName: mise.jdx.dev
        - matchName: pypi.org
        - matchPattern: "*.github.com"
        - matchPattern: "*.github.io"
        - matchPattern: "*.githubusercontent.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
