---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ciliumnetworkpolicy.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./litellmteam.yaml
  - ./litellmvirtualkey.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: hermes-profile-seed
    files:
      - ./resources/profile-seed/config.yaml
      - ./resources/profile-seed/pr-approval-skill.md
      - ./resources/profile-seed/pr-gate.py
      - ./resources/profile-seed/SOUL.md
      - ./resources/profile-seed/seed.sh
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # seed.sh uses shell ${...} expansions that Flux must not substitute
    kustomize.toolkit.fluxcd.io/substitute: disabled
