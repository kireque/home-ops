---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  values:
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # The image's hermes user is 10000; kopiur movers match via KOPIUR_MOVER_UID/GID
          securityContext:
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 10000
            runAsNonRoot: true
            runAsUser: 10000
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 60
        strategy: Recreate
        initContainers:
          profile-seed:
            image: &image
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
            command:
              - /bin/bash
              - /seed/seed.sh
            env:
              API_SERVER_KEY: &apiServerKey
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: API_SERVER_KEY
              LITELLM_API_KEY: &litellmKey
                valueFrom:
                  secretKeyRef:
                    name: hermes-litellm
                    key: key
              # seed.sh registers cron jobs with the hermes CLI
              HERMES_HOME: /opt/data
              SEARXNG_URL: &searxng http://searxng.ai.svc.cluster.local:8080
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          # Run the image's config migration before s6 starts. Its own boot hook calls it through
          # `s6-setuidgid hermes`, which needs CAP_SETGID and fails as non-root. Skipped on first
          # boot only when no profile config was seeded.
          config-migrate:
            image: *image
            command:
              - /bin/sh
              - -c
              - >-
                [ ! -f /opt/data/config.yaml ] ||
                exec /opt/hermes/.venv/bin/python /opt/hermes/scripts/docker_config_migrate.py
            env:
              HOME: /opt/data
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext: *securityContext
        containers:
          app:
            image: *image
            args:
              - sleep
              - infinity
            env:
              API_SERVER_KEY: *apiServerKey
              BASH_ENV: /opt/data/.hermes-terminal-env.sh
              HERMES_DISABLE_LAZY_INSTALLS: "true"
              HERMES_HOME: /opt/data
              HERMES_WRITE_SAFE_ROOT: /opt/data
              HOME: /opt/data
              LITELLM_API_KEY: *litellmKey
              LITELLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              # Terminal HOME moves into each named profile; mise stays on the shared PVC
              MISE_CACHE_DIR: /opt/data/.cache/mise
              MISE_CONFIG_DIR: /opt/data/.config/mise
              MISE_DATA_DIR: /opt/data/.local/share/mise
              MISE_STATE_DIR: /opt/data/.local/state/mise
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
              SEARXNG_URL: *searxng
            probes:
              # The gateway's cron ticker rewrites this heartbeat every 60s
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &healthcheck
                      - /bin/sh
                      - -c
                      - >-
                        hb=$(cut -d. -f1 /opt/data/cron/ticker_heartbeat) &&
                        [ $(( $(date +%s) - hb )) -lt 300 ]
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
            securityContext: *securityContext
          # Holds the GitHub App key and enforces the PR approval rules, so the key
          # never reaches the agent's shell. Loopback only; the agent calls it via pr-gate.py
          pr-gate:
            image: *image
            command:
              - /opt/hermes/.venv/bin/python3
              - /seed/pr-gate-server.py
            env:
              PYTHONUNBUFFERED: "1"
            probes:
              liveness: &prGateProbes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /opt/hermes/.venv/bin/python3
                      - -c
                      - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8765/healthz", timeout=3)
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *prGateProbes
            resources:
              requests:
                cpu: 5m
              limits:
                memory: 128Mi
            securityContext: *securityContext
          webui:
            image:
              repository: ghcr.io/nesquena/hermes-webui
              tag: 0.52.600@sha256:0adc094fdc9d658feca8a78973ca42892fbe050c0825303c46e1db5b481be87e
            env:
              HERMES_API_URL: http://127.0.0.1:8642
              HERMES_HOME: /home/hermeswebui/.hermes
              HERMES_WEBUI_CHAT_BACKEND: gateway
              HERMES_WEBUI_DEFAULT_WORKSPACE: /home/hermeswebui/.hermes/workspace
              HERMES_WEBUI_GATEWAY_API_KEY: *apiServerKey
              HERMES_WEBUI_GATEWAY_BASE_URL: http://127.0.0.1:8642
              HERMES_WEBUI_GATEWAY_USE_RUNS_API: "true"
              HERMES_WEBUI_HOST: 0.0.0.0
              HERMES_WEBUI_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: WEBUI_PASSWORD
              HERMES_WEBUI_PORT: &port 8787
              HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui
              HOME: /home/hermeswebui
              LITELLM_API_KEY: *litellmKey
              UV_CACHE_DIR: /uv_cache
              WANTED_GID: "10000"
              WANTED_UID: "10000"
            # The init script runs as PID 1 without forwarding SIGTERM; signal server.py directly
            lifecycle:
              preStop:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - kill -TERM $(cat /proc/1/task/1/children)
            probes:
              liveness: &webuiProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
              readiness: *webuiProbes
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 90
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 4Gi
            securityContext: *securityContext
    persistence:
      data:
        existingClaim: hermes
        advancedMounts:
          hermes:
            app:
              - path: /opt/data
            config-migrate:
              - path: /opt/data
            profile-seed:
              - path: /opt/data
            webui:
              - path: /home/hermeswebui/.hermes
      agent-source:
        type: image
        image: *image
        advancedMounts:
          hermes:
            webui:
              - path: /home/hermeswebui/.hermes/hermes-agent
                subPath: opt/hermes
                readOnly: true
      app:
        type: emptyDir
        advancedMounts:
          hermes:
            webui:
              - path: /app
      # GitHub App identity for PR approvals. Only the pr-gate sidecar may read it;
      # never mount it into app, where the agent has a shell. Optional so Hermes
      # still starts before the App exists; seed.sh then skips the cron job
      github-app:
        type: custom
        volumeSpec:
          secret:
            secretName: hermes-github
            defaultMode: 288
            optional: true
        advancedMounts:
          hermes:
            pr-gate:
              - path: &githubApp /var/run/secrets/hermes-github
                readOnly: true
            profile-seed:
              - path: *githubApp
                readOnly: true
      mise:
        type: image
        image: ghcr.io/jdx/mise:2026.10.23@sha256:c13bf248d1d2939fb0597df3fbeeac5bd39c53d0210364d1ca00b126ed1212d2
        advancedMounts:
          hermes:
            app:
              - path: /opt/mise
                subPath: usr/local/bin
                readOnly: true
            profile-seed:
              - path: /opt/mise
                subPath: usr/local/bin
                readOnly: true
      profile-seed:
        type: configMap
        name: hermes-profile-seed
        advancedMounts:
          hermes:
            pr-gate:
              - path: /seed
                readOnly: true
            profile-seed:
              - path: /seed
                readOnly: true
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
      uv-cache:
        type: emptyDir
        advancedMounts:
          hermes:
            webui:
              - path: /uv_cache
    route:
      app:
        hostnames:
          - hermes.econline.nl
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port
