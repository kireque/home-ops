---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  values:
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # The image's hermes user is 10000; kopiur movers match via KOPIUR_MOVER_UID/GID
          securityContext:
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 10000
            runAsNonRoot: true
            runAsUser: 10000
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 60
        strategy: Recreate
        initContainers:
          profile-seed:
            image: &image
              repository: docker.io/nousresearch/hermes-agent
              tag: v0.22.7@sha256:e6d81ae52ebf6a43efa529701405509f20054ba818f179ddd748bed4f8af584c
            command:
              - /bin/bash
              - /seed/seed.sh
            env:
              API_SERVER_KEY: &apiServerKey
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: API_SERVER_KEY
              LITELLM_API_KEY: &litellmKey
                valueFrom:
                  secretKeyRef:
                    name: hermes-litellm
                    key: key
              # seed.sh registers cron jobs with the hermes CLI
              HERMES_HOME: /opt/data
              SEARXNG_URL: &searxng http://searxng.ai.svc.cluster.local:8080
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          # Run the image's config migration before s6 starts. Its own boot hook calls it through
          # `s6-setuidgid hermes`, which needs CAP_SETGID and fails as non-root. Skipped on first
          # boot only when no profile config was seeded.
          config-migrate:
            image: *image
            command:
              - /bin/sh
              - -c
              - >-
                [ ! -f /opt/data/config.yaml ] ||
                exec /opt/hermes/.venv/bin/python /opt/hermes/scripts/docker_config_migrate.py
            env:
              HOME: /opt/data
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext: *securityContext
        containers:
          app:
            image: *image
            # Start the gateway (which serves the Webapp) under s6
            args:
              - gateway
              - run
            env:
              API_SERVER_KEY: *apiServerKey
              BASH_ENV: /opt/data/.hermes-terminal-env.sh
              HERMES_DASHBOARD: "true"
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: hermes-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
              HERMES_DASHBOARD_PORT: "9119"
              HERMES_DISABLE_LAZY_INSTALLS: "true"
              HERMES_HOME: /opt/data
              HERMES_WRITE_SAFE_ROOT: /opt/data
              HOME: /opt/data
              LITELLM_API_KEY: *litellmKey
              LITELLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              # Terminal HOME moves into each named profile; mise stays on the shared PVC
              MISE_CACHE_DIR: /opt/data/.cache/mise
              MISE_CONFIG_DIR: /opt/data/.config/mise
              MISE_DATA_DIR: /opt/data/.local/share/mise
              MISE_STATE_DIR: /opt/data/.local/state/mise
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
              SEARXNG_URL: *searxng
            probes:
              # The gateway's cron ticker rewrites this heartbeat every 60s
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &healthcheck
                      - /bin/sh
                      - -c
                      - >-
                        hb=$(cut -d. -f1 /opt/data/cron/ticker_heartbeat) &&
                        [ $(( $(date +%s) - hb )) -lt 300 ]
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
            # The gateway now also serves the Webapp and the Dashboard
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 4Gi
            securityContext: *securityContext
          # Holds the GitHub App key and enforces the PR approval rules, so the key
          # never reaches the agent's shell. Loopback only; the agent calls it via pr-gate.py
          pr-gate:
            image: *image
            command:
              - /opt/hermes/.venv/bin/python3
              - /seed/pr-gate-server.py
            env:
              PYTHONUNBUFFERED: "1"
            probes:
              liveness: &prGateProbes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /opt/hermes/.venv/bin/python3
                      - -c
                      - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8765/healthz", timeout=3)
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *prGateProbes
            resources:
              requests:
                cpu: 5m
              limits:
                memory: 128Mi
            securityContext: *securityContext
    persistence:
      data:
        existingClaim: hermes
        advancedMounts:
          hermes:
            app:
              - path: /opt/data
            config-migrate:
              - path: /opt/data
            profile-seed:
              - path: /opt/data
      # GitHub App identity for PR approvals. Only the pr-gate sidecar may read it;
      # never mount it into app, where the agent has a shell. Optional so Hermes
      # still starts before the App exists; seed.sh then skips the cron job
      github-app:
        type: custom
        volumeSpec:
          secret:
            secretName: hermes-github
            defaultMode: 288
            optional: true
        advancedMounts:
          hermes:
            pr-gate:
              - path: &githubApp /var/run/secrets/hermes-github
                readOnly: true
            profile-seed:
              - path: *githubApp
                readOnly: true
      mise:
        type: image
        image: ghcr.io/jdx/mise:2026.11.2@sha256:39cd8aad519a3dbc860eceb64dfd8cb5efe4cdbb8ad741a6867b544b2787b79c
        advancedMounts:
          hermes:
            app:
              - path: /opt/mise
                subPath: usr/local/bin
                readOnly: true
            profile-seed:
              - path: /opt/mise
                subPath: usr/local/bin
                readOnly: true
      profile-seed:
        type: configMap
        name: hermes-profile-seed
        advancedMounts:
          hermes:
            pr-gate:
              - path: /seed
                readOnly: true
            profile-seed:
              - path: /seed
                readOnly: true
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      dashboard:
        hostnames:
          - hermes-dash.econline.nl
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: dashboard
      webapp:
        hostnames:
          - hermes.econline.nl
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: webapp
            # Chats stream over long-lived websockets
            timeouts:
              request: 0s
    service:
      app:
        ports:
          dashboard:
            appProtocol: kubernetes.io/wss
            port: 9119
          webapp:
            appProtocol: kubernetes.io/wss
            port: 9120
