---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-secret
    creationPolicy: Owner
    template:
      data:
        API_SERVER_KEY: "{{ .API_SERVER_KEY }}"
        WEBUI_PASSWORD: "{{ .WEBUI_PASSWORD }}"
  dataFrom:
    - extract:
        key: hermes
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-github
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-github
    creationPolicy: Owner
    template:
      data:
        app-id: "{{ .APP_ID }}"
        private-key: "{{ .PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: hermes-github
