---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# Internal only: Claude Code on the LAN reaches the MCP endpoint here; the
# OpenAI-compatible API is exposed too for local tooling. Both need an API key.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway
spec:
  hostnames:
    - agentgateway.econline.nl
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: agentgateway
          port: 8081
      matches:
        - path:
            type: PathPrefix
            value: /mcp
    - backendRefs:
        - name: agentgateway
          port: 8080
