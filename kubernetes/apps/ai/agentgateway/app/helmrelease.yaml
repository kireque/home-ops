---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
spec:
  chartRef:
    kind: OCIRepository
    name: agentgateway
  interval: 1h
  values:
    nameOverride: agentgateway
    # Static config from a read-only ConfigMap: no database, no Admin UI.
    mode: readonly
    replicaCount: 1
    session:
      secretName: agentgateway
    # agentgateway expands ${VAR} in its config from these at startup
    extraEnv:
      - name: AZURE_API_KEY
        valueFrom:
          secretKeyRef:
            name: agentgateway
            key: AZURE_API_KEY
      - name: BAZARR_API_KEY
        valueFrom:
          secretKeyRef:
            name: agentgateway
            key: BAZARR_API_KEY
      - name: CLAUDE_CODE_API_KEY
        valueFrom:
          secretKeyRef:
            name: agentgateway
            key: CLAUDE_CODE_API_KEY
      - name: CONTEXT7_API_KEY
        valueFrom:
          secretKeyRef:
            name: agentgateway
            key: CONTEXT7_API_KEY
      - name: HERMES_API_KEY
        valueFrom:
          secretKeyRef:
            name: agentgateway
            key: HERMES_API_KEY
      - name: PR_REVIEW_API_KEY
        valueFrom:
          secretKeyRef:
            name: agentgateway
            key: PR_REVIEW_API_KEY
    gateway:
      service:
        type: ClusterIP
        ports:
          - name: llm
            port: 8080
            targetPort: 8080
            protocol: TCP
          - name: mcp
            port: 8081
            targetPort: 8081
            protocol: TCP
          - name: metrics
            port: 15020
            targetPort: 15020
            protocol: TCP
    monitoring:
      enabled: true
    podSecurityContext:
      runAsGroup: 65534
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
    config:
      config:
        adminAddr: "off"
        readinessAddr: 0.0.0.0:15021
        statsAddr: 0.0.0.0:15020
      # OpenAI-compatible API (/v1/chat/completions, /v1/models, ...)
      llm:
        port: 8080
        policies:
          apiKey:
            mode: strict
            keys:
              - key: ${BAZARR_API_KEY}
                metadata:
                  client: bazarr
                allowedModels:
                  - gpt-5.4
              - key: ${CLAUDE_CODE_API_KEY}
                metadata:
                  client: claude-code
                allowedModels:
                  - gpt-5.4
                  - gpt-5.6-sol
                  - gpt-6.1-sol
                  - gpt-6.1-terra
                  - gpt-chat-latest
              - key: ${HERMES_API_KEY}
                metadata:
                  client: hermes
                allowedModels:
                  - gpt-5.4
                  - gpt-5.6-sol
                  - gpt-6.1-sol
                  - gpt-6.1-terra
                  - gpt-chat-latest
              - key: ${PR_REVIEW_API_KEY}
                metadata:
                  client: pr-review
                allowedModels:
                  - gpt-5.4
                  - gpt-5.6-sol
                  - gpt-6.1-sol
        # Azure AI Foundry deployments via the resource-level v1 API
        # (econline-foundry.openai.azure.com/openai/v1/...)
        models:
          - name: gpt-5.4
            provider: azure
            params:
              apiKey: ${AZURE_API_KEY}
              azureApiVersion: v1
              azureResourceName: econline-foundry
              azureResourceType: openAI
              model: gpt-5.4
          - name: gpt-5.6-sol
            provider: azure
            params:
              apiKey: ${AZURE_API_KEY}
              azureApiVersion: v1
              azureResourceName: econline-foundry
              azureResourceType: openAI
              model: gpt-5.6-sol
          - name: gpt-6.1-sol
            provider: azure
            params:
              apiKey: ${AZURE_API_KEY}
              azureApiVersion: v1
              azureResourceName: econline-foundry
              azureResourceType: openAI
              model: gpt-6.1-sol
          - name: gpt-6.1-terra
            provider: azure
            params:
              apiKey: ${AZURE_API_KEY}
              azureApiVersion: v1
              azureResourceName: econline-foundry
              azureResourceType: openAI
              model: gpt-6.1-terra
          - name: gpt-chat-latest
            provider: azure
            params:
              apiKey: ${AZURE_API_KEY}
              azureApiVersion: v1
              azureResourceName: econline-foundry
              azureResourceType: openAI
              model: gpt-chat-latest
      gateways:
        mcp:
          port: 8081
      # One multiplexed MCP endpoint (/mcp), like LiteLLM's: tools are
      # prefixed with the target name. Every target has no auth of its own
      # (except Context7), so the API key policy here is the only gate.
      routes:
        - name: mcp
          gateways:
            - mcp
          matches:
            - path:
                pathPrefix: /mcp
          backends:
            - mcp:
                targets:
                  - name: context7
                    mcp:
                      host: https://mcp.context7.com/mcp
                    policies:
                      backendAuth:
                        key: ${CONTEXT7_API_KEY}
                  - name: flux
                    mcp:
                      host: http://flux-mcp.ai.svc.cluster.local:8000/mcp
                  - name: home_assistant
                    mcp:
                      host: http://home-assistant-mcp.ai.svc.cluster.local:8080/mcp
                  - name: kubectl
                    mcp:
                      host: http://kubectl-mcp.ai.svc.cluster.local:8000/mcp
                  - name: kubesearch
                    mcp:
                      host: http://kubesearch-mcp.ai.svc.cluster.local:3000/mcp
          policies:
            apiKey:
              mode: strict
              keys:
                - key: ${CLAUDE_CODE_API_KEY}
                  metadata:
                    client: claude-code
                - key: ${HERMES_API_KEY}
                  metadata:
                    client: hermes
            mcpAuthorization:
              rules:
                - allow: apiKey.client == "claude-code" || apiKey.client == "hermes"
