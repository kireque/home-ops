---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentgateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway
  # Every client authenticates with its own API key; this only narrows who can try.
  ingress:
    # LLM API (8080) and MCP (8081)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: hermes
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP
    # LLM API only
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: actions-runner-system
            app.kubernetes.io/component: runner
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: downloads
            app.kubernetes.io/name: bazarr
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "15020"
              protocol: TCP
    # With DSR and host-only socket LB, a same-node ClusterIP backend's replies
    # arrive already reverse-NATed to the service IP, miss conntrack and hit
    # ingress policy. Admit the egress targets below so their replies get in.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/component: mcp-server
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
  # Egress is allowlisted: the MCP servers, Azure AI Foundry and Context7.
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/component: mcp-server
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    # No cluster-wide DNS allow exists; the dns rule also feeds toFQDNs below.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: econline-foundry.openai.azure.com
        - matchName: mcp.context7.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
