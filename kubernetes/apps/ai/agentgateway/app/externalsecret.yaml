---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway
    creationPolicy: Owner
    template:
      data:
        # Client keys: one per consumer so each can be scoped and rotated alone
        BAZARR_API_KEY: "{{ .BAZARR_API_KEY }}"
        CLAUDE_CODE_API_KEY: "{{ .CLAUDE_CODE_API_KEY }}"
        HERMES_API_KEY: "{{ .HERMES_API_KEY }}"
        PR_REVIEW_API_KEY: "{{ .PR_REVIEW_API_KEY }}"
        # Upstream credentials, shared with the LiteLLM items until it is removed
        AZURE_API_KEY: "{{ .AZURE_API_KEY }}"
        CONTEXT7_API_KEY: "{{ .api_key }}"
        # AES-256-GCM key for MCP session IDs: 64 hex chars (openssl rand -hex 32)
        key: "{{ .SESSION_KEY }}"
  dataFrom:
    - extract:
        key: agentgateway
    - extract:
        key: litellm
    - extract:
        key: context7-mcp
