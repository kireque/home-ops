---
# Cluster-internal metasearch backend for Open WebUI web search.
# Only overrides are listed; everything else comes from upstream defaults.
# server.secret_key is injected via the SEARXNG_SECRET env var.
use_default_settings: true

general:
  instance_name: SearXNG

search:
  formats:
    - html
    - json

server:
  image_proxy: false
  limiter: false
  public_instance: false
