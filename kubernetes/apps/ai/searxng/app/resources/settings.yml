---
# Cluster-internal metasearch backend for Open WebUI web search.
# Only overrides are listed; everything else comes from upstream defaults.
# server.secret_key is injected via the SEARXNG_SECRET env var.
use_default_settings: true

general:
  instance_name: SearXNG

search:
  formats:
    - html
    - json

server:
  image_proxy: false
  limiter: false
  public_instance: false

# Brave rate-limits and DuckDuckGo serves CAPTCHAs to this instance;
# replace them with web engines that answer reliably from the cluster.
engines:
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: gmx
    disabled: false
  - name: privacywall
    disabled: false
  - name: yahoo
    disabled: false
  - name: yep
    disabled: false
