---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: open-webui
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    externalSecrets:
      open-webui:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              WEBUI_SECRET_KEY: "{{ .WEBUI_SECRET_KEY }}"
              LITELLM_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
        dataFrom:
          - extract:
              key: open-webui
          - extract:
              key: litellm
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        fsGroup: 0
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.12.0
            env:
              # Settings below are authoritative; UI changes are not persisted across restarts
              ENABLE_PERSISTENT_CONFIG: "False"
              WEBUI_URL: https://chat.econline.nl
              # Models via in-cluster LiteLLM (Azure AI Foundry)
              ENABLE_OLLAMA_API: "False"
              OPENAI_API_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              DEFAULT_MODELS: gpt-6.1-sol
              TASK_MODEL_EXTERNAL: gpt-6.1-sol
              # Auth: no self sign-up, new accounts need admin approval
              ENABLE_SIGNUP: "False"
              DEFAULT_USER_ROLE: pending
              ENABLE_API_KEYS: "False"
              ENABLE_COMMUNITY_SHARING: "False"
              WEBUI_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: open-webui
                    key: WEBUI_SECRET_KEY
              OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: open-webui
                    key: LITELLM_API_KEY
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - chat.econline.nl
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: open-webui
        globalMounts:
          - path: /app/backend/data
