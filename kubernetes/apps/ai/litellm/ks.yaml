---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm
spec:
  components:
    - ../../../../components/cnpg/pg18
  targetNamespace: ai
  path: ./kubernetes/apps/ai/litellm/app
  interval: 1h
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: cloudnative-pg
      namespace: database
    - name: cloudnative-pg-barman-plugin
      namespace: database
    - name: litellm-operator
  postBuild:
    substitute:
      APP: *app
  # First creation only: the backup bucket is still empty, so the component's
  # recovery bootstrap has nothing to restore. Drop this patch once the first
  # base backup exists.
  patches:
    - target:
        group: postgresql.cnpg.io
        kind: Cluster
      patch: |-
        - op: replace
          path: /spec/bootstrap
          value:
            initdb:
              database: litellm
              owner: litellm
