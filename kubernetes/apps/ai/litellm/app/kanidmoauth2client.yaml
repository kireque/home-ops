---
# TODO: add schema
# Only members can sign in to the Admin UI, and all of them as proxy admin
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: litellm-admins
spec:
  kanidmRef:
    name: sso
    namespace: security
  members:
    - erik
---
# TODO: add schema
# Admin UI sign-in. Issuer: https://idm.econline.nl/oauth2/openid/litellm
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: litellm
spec:
  # LiteLLM reads the UI role from this claim (GENERIC_USER_ROLE_ATTRIBUTE);
  # csv keeps the single value a plain string, which is what LiteLLM expects
  claimMap:
    - joinStrategy: csv
      name: litellm_role
      valuesMap:
        - group: litellm-admins@idm.econline.nl
          values:
            - proxy_admin
  disableConsentPrompt: true
  displayname: LiteLLM
  kanidmRef:
    name: sso
    namespace: security
  origin: https://litellm.econline.nl/
  preferShortUsername: true
  redirectUrl:
    - https://litellm.econline.nl/sso/callback
  scopeMap:
    - group: litellm-admins@idm.econline.nl
      scopes:
        - email
        - openid
        - profile
  # Also expose the credentials under LiteLLM's generic SSO env names, so the
  # generated secret works as a plain envFrom
  secretKeyAliases:
    clientId:
      - GENERIC_CLIENT_ID
    clientSecret:
      - GENERIC_CLIENT_SECRET
  strictRedirectUrl: true
