---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# Not LiteLLMProxy.spec.route: its filters apply to the whole route, so the
# /metrics block needs its own rule here. Must not be named litellm: with
# spec.route unset the operator deletes any HTTPRoute named after the proxy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm-route
spec:
  hostnames:
    - litellm.econline.nl
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: litellm
          port: 4000
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: litellm-not-found
      matches:
        - path:
            type: PathPrefix
            value: /metrics
