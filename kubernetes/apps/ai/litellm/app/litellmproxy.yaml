---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  image: ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
  replicas: 1
  # Admin API access for DB-backed resources (LiteLLMTeam, LiteLLMVirtualKey).
  # Models stay file-backed because applyMode is left at its default.
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY
  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm-postgres-app
          key: uri
    - name: HOME
      value: /tmp
    - name: LITELLM_LOG
      value: INFO
    # Prisma baselines/migrates from a copy here; the root filesystem is read-only
    - name: LITELLM_MIGRATION_DIR
      value: /tmp/migrations
  envFrom:
    - secretRef:
        name: litellm-secret
  generalSettings:
    master_key: os.environ/LITELLM_MASTER_KEY
    # Envoy gateway pods sit in the pod CIDR; trust only them for X-Forwarded-For
    # so logs and rate limits see the real client address.
    trusted_proxy_ranges:
      - 10.244.0.0/16
    use_x_forwarded_for: true
  litellmSettings:
    drop_params: true
    request_timeout: 600
  # No startupProbe field; the delay covers LiteLLM's slow first boot.
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
  podSecurityContext:
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 4000
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1Gi
  routerSettings:
    cooldown_time: 30
    enable_pre_call_checks: true
    num_retries: 2
    retry_after: 5
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  service:
    port: 4000
  volumeMounts:
    - name: tmp
      mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
