---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: litellm-postgres
spec:
  # No backups yet: the object store (Garage on the NAS) isn't up. Teams and
  # virtual keys are rebuilt by litellm-operator from their CRs, so losing this
  # database costs spend logs only. Swap this file for the cnpg/pg18 component
  # once Garage is live; bootstrap is only read at creation, so the switch keeps
  # the running cluster and just starts WAL archiving.
  bootstrap:
    initdb:
      database: litellm
      owner: litellm
  enablePDB: false
  enableSuperuserAccess: false
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
  instances: 1
  postgresql:
    parameters:
      max_slot_wal_keep_size: 2GB
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  storage:
    size: 8Gi
    storageClass: ceph-block
