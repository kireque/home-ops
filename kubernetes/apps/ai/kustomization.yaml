---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai

components:
  - ../../components/alerts
  - ../../components/namespace

patches:
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: _
        labels:
          resource.kubernetes.io/admin-access: "true"
    target:
      kind: Namespace

resources:
  - ./context7-mcp/ks.yaml
  - ./ha-mcp/ks.yaml
  - ./open-webui/ks.yaml
  - ./toolhive/ks.yaml
