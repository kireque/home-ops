---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    profile: shortlived
    privateKeySecretRef:
      name: letsencrypt-production
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
      - dns01:
          webhook:
            groupName: acme.econline.nl
            solverName: ovh
            config:
              endpoint: ovh-eu
              authenticationMethod: application
              applicationKeyRef:
                name: &secret ovh-issuer-secret
                key: applicationKey
              applicationSecretRef:
                name: *secret
                key: applicationSecret
              applicationConsumerKeyRef:
                name: *secret
                key: applicationConsumerKey
        selector:
          dnsZones:
            - econline.nl
