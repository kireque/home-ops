---
# TODO: add schema
# kaniop writes the credentials to sonarr-kanidm-oauth2-credentials.
# Issuer: https://idm.econline.nl/oauth2/openid/sonarr
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: sonarr
spec:
  disableConsentPrompt: true
  displayname: Sonarr
  image:
    url: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/sonarr.svg
  kanidmRef:
    name: sso
    namespace: security
  origin: https://sonarr.econline.nl/
  preferShortUsername: true
  redirectUrl:
    - https://sonarr.econline.nl/signin-oidc
  # SONARR__AUTH__OIDCSCOPES defaults to openid profile email
  scopeMap:
    - group: homelab-admins@idm.econline.nl
      scopes:
        - email
        - openid
        - profile
  strictRedirectUrl: true
