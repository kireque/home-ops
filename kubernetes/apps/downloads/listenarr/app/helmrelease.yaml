---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: listenarr
spec:
  chartRef:
    kind: OCIRepository
    name: listenarr
  interval: 1h
  values:
    externalSecrets:
      listenarr:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              SABNZBD_API_KEY: "{{ .api_key }}"
        dataFrom:
          - extract:
              key: sabnzbd
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      listenarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # upstream only publishes canary builds
              repository: ghcr.io/listenarrs/listenarr
              tag: canary-1.6.3@sha256:265d4fd8f8242079a6620257dda018d022f053fa7f1d512c5dcbc5c880c3e85d
            env:
              # sign-in is done by Kanidm at the gateway (listenarr-oidc)
              LISTENARR_LOG_LEVEL: Information
              LISTENARR_PUBLIC_URL: https://listenarr.econline.nl
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 4545
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
      # SABnzbd category + download client; idempotent, reruns on every upgrade
      setup:
        type: job
        annotations:
          helm.sh/hook: post-install,post-upgrade
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
        job:
          backoffLimit: 3
        containers:
          app:
            # python3 from the SABnzbd image, which Renovate already tracks
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.3@sha256:c89b0322721c3eba47221e5f916505e7e742684651f73c5215717340b6b5402f
            command:
              - python3
              - /scripts/setup.py
            env:
              LISTENARR_URL: http://listenarr.downloads.svc.cluster.local:4545
              SABNZBD_CATEGORY: audiobooks-listenarr
              SABNZBD_URL: http://sabnzbd.downloads.svc.cluster.local
            envFrom:
              - externalSecretRef:
                  identifier: listenarr
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        pod:
          restartPolicy: Never
    service:
      app:
        controller: listenarr
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.econline.nl"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          listenarr:
            app:
              - path: /app/config
      media:
        type: nfs
        server: gladius.home.econline.nl
        path: /mnt/tank/media
        advancedMounts:
          listenarr:
            app:
              - path: /media
      scripts:
        type: configMap
        name: listenarr-configmap
        advancedMounts:
          setup:
            app:
              - path: /scripts
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          listenarr:
            app:
              - path: /tmp
