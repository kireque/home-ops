---
apiVersion: kustomize.config.k8s.io/v1beta1
configMapGenerator:
  - files:
      - guides-metadata.json=./resources/guides/metadata.json
      - guides-radarr-sqp-1-2160p-dutch.json=./resources/guides/quality-profiles/radarr/sqp-1-2160p-dutch.json
      - radarr-language-not-dutch.json=./resources/custom-formats/radarr-language-not-dutch.json
      - recyclarr.yml=./resources/recyclarr.yml
      - settings.yml=./resources/settings.yml
      - sonarr-language-not-dutch.json=./resources/custom-formats/sonarr-language-not-dutch.json
    name: recyclarr-configmap
generatorOptions:
  disableNameSuffixHash: true
kind: Kustomization
namespace: downloads
patches:
  - patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: _
      spec:
        install:
          crds: CreateReplace
        rollback:
          cleanupOnFail: true
        upgrade:
          cleanupOnFail: true
          crds: CreateReplace
          strategy:
            name: RemediateOnFailure
          remediation:
            remediateLastFailure: true
            retries: 2
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
