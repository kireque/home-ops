---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  chartRef:
    kind: OCIRepository
    name: recyclarr
  interval: 1h
  values:
    externalSecrets:
      recyclarr:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
              SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        dataFrom:
          - extract:
              key: radarr
          - extract:
              key: sonarr
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      recyclarr:
        type: cronjob
        cronjob:
          schedule: 0 0 * * *
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 8.8.1@sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9
            env:
              RECYCLARR_DATA_DIR: /tmp
            envFrom:
              - externalSecretRef:
                  identifier: recyclarr
            args:
              - sync
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
        pod:
          restartPolicy: Never
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      config-file:
        type: configMap
        name: "{{ .Release.Name }}-configmap"
        globalMounts:
          - path: /config/custom-formats/radarr/language-not-dutch.json
            subPath: radarr-language-not-dutch.json
          - path: /config/custom-formats/sonarr/language-not-dutch.json
            subPath: sonarr-language-not-dutch.json
          - path: /config/guides/metadata.json
            subPath: guides-metadata.json
          - path: /config/guides/quality-profiles/radarr/sqp-1-2160p-dutch.json
            subPath: guides-radarr-sqp-1-2160p-dutch.json
          - path: /config/recyclarr.yml
            subPath: recyclarr.yml
          - path: /config/settings.yml
            subPath: settings.yml
      tmp:
        type: emptyDir
