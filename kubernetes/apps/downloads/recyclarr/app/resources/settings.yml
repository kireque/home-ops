---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/refs/tags/v8.0.0/schemas/settings-schema.json
resource_providers:
  - name: local-guides
    type: trash-guides
    path: /config/guides
  - name: local-radarr-cfs
    type: custom-formats
    path: /config/custom-formats/radarr
    service: radarr
  - name: local-sonarr-cfs
    type: custom-formats
    path: /config/custom-formats/sonarr
    service: sonarr
