---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/refs/tags/v8.0.0/schemas/config-schema.json
sonarr:
  series:
    base_url: http://sonarr.downloads.svc.cluster.local
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true
    media_management:
      propers_and_repacks: do_not_prefer
    media_naming:
      episodes:
        anime: default
        daily: default
        rename: true
        standard: default
      season: default
      series: plex-imdb
    quality_definition:
      type: series
    quality_profiles:
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7 # WEB-2160p (Combined)
        name: WEB-2160p (Combined)
        reset_unmatched_scores:
          enabled: true
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7 # WEB-2160p (Combined)
        name: WEB-2160p (Dutch)
        reset_unmatched_scores:
          enabled: true
    custom_formats:
      - # FLUX trumps REPACKS
        trash_ids:
          - 5d9fd1b1e06cd8a475462f40214b7df6 # FLUX
        assign_scores_to:
          - name: WEB-2160p (Combined)
            score: 100
          - name: WEB-2160p (Dutch)
            score: 100
      - # Unwanted
        trash_ids:
          - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
          - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
          - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
          - 06d66ab109d4d2eddb2794d21526d140 # Retags
        assign_scores_to:
          - name: WEB-2160p (Combined)
          - name: WEB-2160p (Dutch)
      - # Dutch audio only: drop the original-language requirement, reject non-Dutch
        trash_ids:
          - ae575f95ab639ba5d15f663bf019e3e8 # Language: Not Original
        assign_scores_to:
          - name: WEB-2160p (Dutch)
            score: 0
      - trash_ids:
          - 10e8d207ef3b424bb578bbfdf354a2ec # Language: Not Dutch (local, resources/custom-formats)
        assign_scores_to:
          - name: WEB-2160p (Dutch)

radarr:
  movies:
    base_url: http://radarr.downloads.svc.cluster.local
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true
    media_management:
      propers_and_repacks: do_not_prefer
    media_naming:
      folder: plex-imdb
      movie:
        rename: true
        standard: plex-imdb
    quality_definition:
      type: sqp-uhd
    quality_profiles:
      - trash_id: 5128baeb2b081b72126bc8482b2a86a0 # [SQP] SQP-1 (2160p)
        reset_unmatched_scores:
          enabled: true
      - trash_id: 8bbc19bff92443eb8b45f77f96e1ecad # [SQP] SQP-1 (2160p) (Dutch) (local, resources/guides)
        min_format_score: 0
        reset_unmatched_scores:
          enabled: true
    custom_format_groups:
      add:
        # Default groups for SQP-1 (2160p); listed so the local Dutch copy gets them too
        - trash_id: ef20e67b95a381fb3bc6d1f06ea24f46 # [HDR Formats] HDR
          assign_scores_to:
            - trash_id: 5128baeb2b081b72126bc8482b2a86a0 # [SQP] SQP-1 (2160p)
            - trash_id: 8bbc19bff92443eb8b45f77f96e1ecad # [SQP] SQP-1 (2160p) (Dutch)
        - trash_id: d9cc9a504e5ede6294c8b973aad4f028 # [Streaming Services] General
          assign_scores_to:
            - trash_id: 5128baeb2b081b72126bc8482b2a86a0 # [SQP] SQP-1 (2160p)
            - trash_id: 8bbc19bff92443eb8b45f77f96e1ecad # [SQP] SQP-1 (2160p) (Dutch)
        - trash_id: 15b1cf0b6f1a1493856a4355907affee # [Unwanted] Unwanted Formats SQP
          assign_scores_to:
            - trash_id: 5128baeb2b081b72126bc8482b2a86a0 # [SQP] SQP-1 (2160p)
            - trash_id: 8bbc19bff92443eb8b45f77f96e1ecad # [SQP] SQP-1 (2160p) (Dutch)
    custom_formats:
      - # Unwanted
        trash_ids:
          - 957d0f44b592285f26449575e8b1167e # Special Edition
          - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
          - cc444569854e9de0b084ab2b8b1532b2 # Black and White Editions
          - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
          - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
          - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
          - f537cf427b64c38c8e36298f657e4828 # Scene
        assign_scores_to:
          - trash_id: 5128baeb2b081b72126bc8482b2a86a0 # [SQP] SQP-1 (2160p)
          - trash_id: 8bbc19bff92443eb8b45f77f96e1ecad # [SQP] SQP-1 (2160p) (Dutch)
      - # Dutch audio only: reject releases without Dutch or Flemish audio
        trash_ids:
          - c206ef7181a1435591490ae77a814999 # Language: Not Dutch (local, resources/custom-formats)
        assign_scores_to:
          - trash_id: 8bbc19bff92443eb8b45f77f96e1ecad # [SQP] SQP-1 (2160p) (Dutch)
