---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: radarr
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/nfs-scaler
  targetNamespace: downloads
  path: ./kubernetes/apps/downloads/radarr/app
  interval: 1h
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: radarr
      KOPIUR_CAPACITY: 10Gi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: radarr-oidc
spec:
  # AUTH__METHOD External: the app trusts whatever reaches it
  components:
    - ../../../../components/oidc
  targetNamespace: downloads
  path: ./kubernetes/apps/downloads/radarr/oidc
  interval: 1h
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: radarr
    - name: kanidm
      namespace: security
  postBuild:
    substitute:
      APP: radarr
      OIDC_HOSTNAME: radarr.econline.nl
      OIDC_ROUTE: radarr
