---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  chartRef:
    kind: OCIRepository
    name: radarr
  interval: 1h
  values:
    externalSecrets:
      radarr:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              RADARR__AUTH__APIKEY: "{{ .RADARR_API_KEY }}"
        dataFrom:
          - extract:
              key: radarr
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      radarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 7.0.2.10888@sha256:69ea515df6e2a3ea1490cfa127ffaaf9597a9db84fffa2fa150a6fae98fe04cb
            env:
              RADARR__APP__INSTANCENAME: Radarr
              RADARR__APP__THEME: dark
              RADARR__AUTH__METHOD: Oidc
              RADARR__AUTH__OIDCAUTHORITY: https://idm.econline.nl/oauth2/openid/radarr
              RADARR__AUTH__OIDCCLIENTID:
                valueFrom:
                  secretKeyRef:
                    name: radarr-kanidm-oauth2-credentials
                    key: CLIENT_ID
              RADARR__AUTH__OIDCCLIENTSECRET:
                valueFrom:
                  secretKeyRef:
                    name: radarr-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
              # Kanidm uuid (sub) of erik; the app lets in exactly one user
              RADARR__AUTH__OIDCUSERIDENTIFIER: a44371c2-5039-4335-8331-4997f012d19b
              RADARR__AUTH__REQUIRED: Enabled
              RADARR__LOG__DBENABLED: "False"
              RADARR__LOG__LEVEL: info
              RADARR__SERVER__PORT: &port 80
              # trust X-Forwarded-Proto from envoy so the OIDC callback is https
              RADARR__SERVER__TRUSTEDNETWORKS: 10.244.0.0/16
              RADARR__UPDATE__BRANCH: develop
            envFrom:
              - externalSecretRef:
                  identifier: radarr
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.econline.nl"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      media:
        type: nfs
        server: gladius.home.econline.nl
        path: /mnt/tank/media
        globalMounts:
          - path: /media
      tmp:
        type: emptyDir
