---
# TODO: add schema
apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: sso
spec:
  # Baked into passkeys and OAuth2 issuer URLs; changing it means re-enrolling every passkey
  domain: idm.econline.nl
  gateway:
    backendTlsPolicy:
      validation:
        hostname: idm.econline.nl
        wellKnownCaCertificates: System
    hostnames:
      - idm.econline.nl
    parentRefs:
      - name: envoy-internal
        namespace: network
  # OAuth2 clients and groups live next to the apps that use them
  groupNamespaceSelector: {}
  # Must match the Kanidm client kaniop is built with (0.23.0 → 1.12.x); a newer
  # server is flagged incompatible and the StatefulSet is never created
  image: docker.io/kanidm/server:1.12.1@sha256:77198131f28116203e105d2e42214203757d113a694f35de545669e75db5c96f
  logLevel: info
  oauth2ClientNamespaceSelector: {}
  origin: https://idm.econline.nl
  replicaGroups:
    - name: default
      primaryNode: true
      replicas: 1
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 10m
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: ceph-block
  tlsSecretName: idm-econline-nl-tls
