---
# TODO: add schema
apiVersion: kaniop.rs/v1alpha1
kind: KanidmBackupSchedule
metadata:
  name: sso
spec:
  jitterSeconds: 300
  kanidmRef:
    name: sso
  localVersions: 7
  repositoryRef:
    name: garage
  # kanidmRef, repositoryRef, retention and schedule are immutable: changing one
  # means deleting and recreating this Schedule (existing backups survive)
  retention:
    daily: 7
    keepLast: 8
    minAge: 24h
    monthly: 6
    weekly: 4
  # Standard 5-field cron
  schedule: 30 2 * * *
  timeZone: Europe/Amsterdam
