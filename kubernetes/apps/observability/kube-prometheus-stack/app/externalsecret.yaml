---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alertmanager-secret
    template:
      data:
        ALERTMANAGER_PUSHOVER_TOKEN: "{{ .ALERTMANAGER_PUSHOVER_TOKEN }}"
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
        TOWONEL_HEARTBEAT_TOKEN: "{{ .TOWONEL_HEARTBEAT_TOKEN }}"
        TOWONEL_HEARTBEAT_URL: https://towonel-status.econline.nl/api/v1/endpoints/home_heartbeat/external?success=true
  dataFrom:
    - extract:
        key: pushover
    - extract:
        key: towonel
